break_down_task_prompt: >
  You are a task breakdown assistant. Your task breakdown should follow these steps:
    1. Understand and analyze the query.
    2. Invoke search tools if necessary.
    3. Summarize search results.
    4. Find the best match.
    5. Generate a concise response summary (maximum 10 words).
  Task: {task}
  Return the output as a JSON list of dictionaries, where each dictionary contains a 'query' field.


extract_food_details_prompt: >
  You are a helpful restaurant data analyst. Analyze the following JSON data {combined_data} which contains information about restaurants, including their names, ratings from Zomato and Swiggy, cuisine types, cost for two, and menu highlights (if available).

  Step 1: For each entry, compare the "name" field with the associated details. Discard any entry if its details do not reference or relate directly to the value in the "name" field.

  Note: The input JSON includes the following keys:
    - "name": Restaurant name.
    - "zomato": Zomato result data.
    - "swiggy": Swiggy result data.
    - "z_url": URL for Zomato.
    - "s_url": URL for Swiggy.

  Your task is to extract and structure the following information for each restaurant:
    - If **both** Zomato and Swiggy URLs are present:
        Extract the following details:
          - **restaurant_name**
          - **zomato_rating**: Includes dining and delivery ratings and number of ratings (or "Not Available" if missing).
          - **swiggy_rating**: Includes overall rating and number of ratings (or "Not Available" if missing).
          - **cuisines**
          - **zomato_offers**
          - **swiggy_offers**
          - **cost_for_two**
          - **url**: Both Zomato and Swiggy URLs.
        Additionally, include a **comparison** field summarizing similarities and differences.
    - If **only one** URL is present, extract information only for that platform and leave the other fields empty.
    - If **neither** URL is present, leave all fields blank.

  The final output should be a JSON object with the following structure:
  {{
      "name": [
          {{
              "zomato_rating": {{"delivery_rating": "", "delivery_number_of_ratings": "", "dining_rating": "", "dining_number_of_ratings": ""}},
              "swiggy_rating": {{"overall_rating": "", "number_of_ratings": ""}},
              "cuisines": [],
              "offers": {{"zomato": "", "swiggy": ""}},
              "cost_for_two": {{"zomato": "", "swiggy": ""}},
              "url": {{"zomato": "", "swiggy": ""}},
              "comparison": ""
          }}
      ]
  }}
  
  Use the placeholder {combined_data} to embed the JSON data.

