fetch_web_content_tool_prompt: >
  You are provided with a {data} that contains search results for a user {query}. The JSON has the following structure:
  - "query": The user's query.
  - "number_of_results": Total number of search results.
  - "results": An array of result objects. Each result object contains:
      - "url": The URL of the result.
      - "title": The title of the result.
      - "content": A content preview from the webpage/homepage.
      - "content_summary": A detailed summary of the URL's content.

  Step 1: Your task is to analyze the {data} and answer the {query} based on the available information. The answer should include:
  - A clear introduction acknowledging the query.
  - **Overall Summary:** First, provide an overall summary by consolidating and summarizing the "content_summary" from all the results.
  - **Places Detail:** Next, focus on extracting details about specific food and beverage establishments that offer a relaxed, work-friendly, or social ambience. For each identified place:
      - Filter out and include only results that clearly pertain to physical establishments (e.g., cafes, restaurants, hotels) and exclude names that refer to review platforms or generic websites (e.g., Zomato, Tripadvisor, etc.).
      - Consolidate and summarize the information from their "content_summary".
      - Include clickable reference links using the "url" and "title" information for each place.

  Step 2: Return the final output strictly in JSON format. Entries should be unique and arranged in decreasing order (most relevant first) with a relevance score. Note:
  - name: the name of the physical establishment.
  - relevance-score: a higher score indicates higher relevance to the user query.

  The JSON output should have the following structure:
  {{
      "overall_summary": "A consolidated summary of all search results' content.",
      "places": [
          {{
              "name": "",
              "summary": [],
              "url": []
          }},
          {{
              "name": "",
              "summary": [],
              "url": []
          }}
      ]
  }}

  Example for places:
  {{
      "overall_summary": "Combined summary from the content summaries of all the results, capturing the main themes, insights, and relevant details from the search.",
      "places": [
          {{
              "name": "Third Wave Coffee Roasters",
              "summary": [
                  "Minimalist decor and calming ambience, creating an ideal environment for creativity and productivity.",
                  "Offers a variety of coffee blends, tea, and snacks to keep you fueled throughout your workday.",
                  "Ample seating options, including comfortable chairs, couches, and communal tables.",
                  "Fast and reliable Wi-Fi and quiet atmosphere."
              ],
              "url": [
                  {{
                      "title": "r/bangalore on Reddit: Cafes in HSR Layout where you can work (write books) and drink coffee",
                      "url": "https://www.reddit.com/r/bangalore/comments/139lh17/cafes_in_hsr_layout_where_you_can_work_write"
                  }},
                  {{
                      "title": "10 Cafes To Work in HSR, Bangalore | Best Cafes Good for Working",
                      "url": "https://digest.myhq.in/cafes-to-work-in-hsr"
                  }}
              ]
          }}
      ]
  }}