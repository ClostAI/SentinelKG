fetch_content_tool_prompt: >
  You are provided with a dataset containing search results for a user query: {query}. The dataset has the following structure:
    - "query": The user's query.
    - "number_of_results": Total number of search results.
    - "results": An array of result objects. Each result object contains:
        - "url": The URL of the result.
        - "title": The title of the result.
        - "content": A preview generated from the webpage/homepage.
        - "content_summary": Detailed content of the URL.

  Your task is to analyze the dataset and generate a response based on the query type. Follow these rules exactly:

  1. If the query is related to finding places (e.g., "find cafes", "best restaurants near me", "cafes in HSR with ambiance"):
      - A clear introduction acknowledging the query.
      - **Overall Summary:** First, provide an overall summary by consolidating and summarizing the "content_summary" from all the results.
      - **Places Detail:** Next, focus on extracting details about specific food and beverage establishments that offer a relaxed, work-friendly, or social ambience. For each identified place:
          - Filter out and include only results that clearly pertain to physical establishments (e.g., cafes, restaurants, hotels) and exclude names that refer to review platforms or generic websites (e.g., Zomato, Tripadvisor, etc.).
          - Consolidate and summarize the information from their "content_summary".
          - Include clickable reference links using the "url" and "title" information for each place.
      
      - Your output MUST be in strict JSON format.
      - Output ONLY the JSON with no additional text.
      - Use the exact structure below:
      
      ```json
      
      {{
       "response": {{
        "overall_summary": "A consolidated summary of all search results' content.",
        "places": [
          {{
            "name": "Name of the establishment",
            "summary": [
              "Key feature 1",
              "Key feature 2"
            ],
            "url": [
              {{
                "title": "Reference title 1",
                "url": "Reference URL 1"
              }},
              {{
                "title": "Reference title 2",
                "url": "Reference URL 2"
              }}
            ]
          }}
        ]
        }}
      }}
      ```
      
  2. For all other queries:
      - Your output MUST be in Markdown format.
      - Provide a clear and concise answer using the "content_summary" from the search results.
      - Include a section "url" that is a list of URLs used as references.
      - Output ONLY the Markdown formatted answer with no additional commentary.

  IMPORTANT:
    - Do not include any extra text or explanation beyond the required output.
    - Ensure that the final response strictly adheres to the designated structure.
    - Entries must be unique and ordered by relevance.


summarisation_prompt_old: >
  Role: You are a meticulous information extraction agent specializing in contextual analysis of places/establishments   Extract structured data from the input text in the following strict JSON format only. Do not include any explanations or additional text—output valid JSON only.

  Input:
  1) A block of text (dictionary) (under the key "document"):  {text} The document has the following structure:
          - "url": The URL of the result as key
          - "summary": Detailed content of the URL as the value
  
  2) A target category (under the key "category"): "{category}". 

  Task:
  Analyze the text to identify all unique entities (e.g., cafés, restaurants, shops) matching the target category. For each entity, extract:

  1. Entity Identification
    entity: Formal name of the place (e.g., "The Rustic Bean Café").

  2. Attribute Extraction
    For each entity, gather (do not add information make sure it is from the document only if not present do not add):

    Specialties/Features:

    Signature items (e.g., "matcha croissants", "hand-drip coffee")

    Unique selling points (e.g., "organic ingredients", "live jazz nights")

    Ambiance descriptors (e.g., "rustic decor", "pet-friendly patio")

    Positive Feedback:

    Explicit praise (e.g., "rave about the friendly staff")

    Implied approval (e.g., "always packed at lunchtime")

    Star ratings (e.g., "4.7/5 stars")

    Recommendations: (eg: I've tried espresso and Kalita from their small setup in Indiranagar and enjoyed it.)

    Negative Feedback:

    Criticisms (e.g., "slow service during peak hours")

    Complaints (e.g., "overpriced smoothies")

    Comparative weaknesses (e.g., "less vegan options than competitors")

    Additional Attributes:

    Price range (e.g., "$$", "budget-friendly")

    Accessibility (e.g., "wheelchair-accessible entrance")

    Parking (eg. difficult to find parking)

    Operational details (e.g., "open until midnight on weekends")

  3. Relationship Labeling
  Use "has_attribute" for all entries to maintain consistency.

  Output Requirements:
  Strictly follow this JSON structure:
  {{  
    "extractions": [  
      {{  
        "entity": "<entity name>",  
        "attributes": {{ "<attr_name>": "<attr_value>", ... }},  
        "relationship": "<relationship_label>",
        "url": [
              {{
                "title": "Reference title 1",
                "url": "Reference URL 1"
              }},
              {{
                "title": "Reference title 2",
                "url": "Reference URL 2"
              }}
            ] 
      }},  
      ...  
    ]  
  }}


