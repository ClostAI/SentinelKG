<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        .tool-list {
            list-style-type: none;
            padding: 0;
        }
        .tool-item {
            background-color: #fff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        .tool-item h2 {
            margin: 0;
            color: #007bff;
        }
        .tool-item p {
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Available Tools</h1>
    <ul class="tool-list">
        {% for tool in tools_info %}
        <li class="tool-item">
            <h2>{{ tool.name }}</h2>
            <p>{{ tool.description or 'No description available.' }}</p>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
